    out.cables.push({
      uid: takeUid(c.uid, 'w'), id: str(c.id).trim(), ifaceUid: f ? f.uid : str(fRaw), name: str(c.name),
      compA: a.comp, portA: a.port, compB: b.comp, portB: b.port, type: str(c.type), connA: str(c.connA), connB: str(c.connB),
      pinout, length: Number.isFinite(len) ? len : null, lengthUnit: pick(c.lengthUnit, LENGTH_UNITS, 'm'),
      shielding: pick(c.shielding, SHIELDING, 'None'), partNumber: str(c.partNumber), notes: str(c.notes), status: pick(c.status, STATUSES, 'Da verificare')
    });
  });
  const resolveLink = (l, label) => {
    if (!isObj(l)) { warnings.push(label + ': collegamento non valido ignorato.'); return null; }
    const kind = ['interface', 'cable', 'component', 'port'].includes(l.kind) ? l.kind : null;
    if (!kind) { warnings.push(label + ': tipo di collegamento “' + str(l.kind) + '” non riconosciuto.'); return null; }
    const v = l.uid != null ? l.uid : (l.id != null ? l.id : l.ref);
    let o = null;
    if (kind === 'interface') o = ifRef(v);
    else if (kind === 'cable') o = out.cables.find((c) => c.uid === v) || out.cables.find((c) => eqId(c.id, v));
    else if (kind === 'component') o = compRef(v);
    else o = portRef(null, v);
    if (!o) { warnings.push(label + ': ' + KIND_IT[kind].toLowerCase() + ' “' + str(v) + '” non trovato.'); return { kind, uid: str(v) }; }
    return { kind, uid: o.uid };
  };
  d.requirements.forEach((r, i) => {
    if (!isObj(r)) { errors.push('Requisito #' + (i + 1) + ': non è un oggetto.'); return; }
    if (!str(r.id).trim()) errors.push('Requisito #' + (i + 1) + ': ID mancante.');
    const label = 'Requisito ' + (r.id || '#' + (i + 1));
    const raws = Array.isArray(r.links) ? r.links : (r.link ? [r.link] : []);
    out.requirements.push({
      uid: takeUid(r.uid, 'r'), id: str(r.id).trim(), text: str(r.text), type: pick(r.type, REQ_TYPES, 'Interface'), origin: pick(r.origin, REQ_ORIGINS, 'System derived'),
      links: raws.map((l) => resolveLink(l, label)).filter(Boolean), method: pick(r.method, REQ_METHODS, 'Test'),
      owner: pick(r.owner, out.lists.owners, 'Da assegnare'), status: pick(r.status, REQ_STATUSES, 'Draft'), notes: str(r.notes)
    });
  });
  const dupWarn = (arr, label) => {
    const seen = new Set();
    arr.forEach((o) => { const k = normId(o.id); if (k && seen.has(k)) warnings.push(label + ' con ID duplicato: ' + o.id + '.'); seen.add(k); });
  };
  dupWarn(out.groups, 'Gruppo'); dupWarn(out.components, 'Componente'); dupWarn(out.interfaces, 'Interfaccia'); dupWarn(out.cables, 'Cavo'); dupWarn(out.requirements, 'Requisito');
  return { errors, warnings, data: out };
}
async function importJsonFile(file) {
  let text;
  try { text = await file.text(); } catch (e) { showModal({ title: 'Importazione non riuscita', body: 'Impossibile leggere il file: ' + e.message }); return; }
  let raw;
  try { raw = JSON.parse(text); } catch (e) {
    showModal({ title: 'Importazione non riuscita', body: [h('p', null, 'Il file “' + file.name + '” non è un JSON valido.'), h('div', { class: 'err-log' }, e.message)] });
    return;
  }
  const res = normalizeData(raw);
  if (res.errors.length) {
    showModal({
      title: 'File non valido: importazione annullata', wide: true,
      body: [h('p', null, 'Sono stati rilevati ' + plural(res.errors.length, 'errore bloccante', 'errori bloccanti') + ' in “' + file.name + '”. I dati correnti non sono stati modificati.'),
        h('div', { class: 'msg-box err' }, h('ul', null, res.errors.slice(0, 80).map((e) => h('li', null, e))))]
    });
    return;
  }
  const dd = res.data;
  const body = [h('p', null, 'Il file “' + file.name + '” è valido e contiene: ',
    h('b', null, plural(dd.groups.length, 'gruppo', 'gruppi') + ', ' + plural(dd.components.length, 'componente', 'componenti') + ', ' +
      plural(dd.components.reduce((s, c) => s + c.ports.length, 0), 'porta', 'porte') + ', ' + plural(dd.interfaces.length, 'interfaccia', 'interfacce') + ', ' +
      plural(dd.cables.length, 'cavo', 'cavi') + ', ' + plural(dd.requirements.length, 'requisito', 'requisiti')), '.'),
  h('p', null, 'I dati attuali verranno sostituiti (l’operazione può essere annullata con “Annulla”).')];
  if (res.warnings.length) body.push(h('div', { class: 'msg-box warn' }, h('b', null, plural(res.warnings.length, 'avviso', 'avvisi') + ':'), h('ul', null, res.warnings.slice(0, 60).map((w) => h('li', null, w)))));
  const ok = await showModal({ title: 'Conferma importazione', body, wide: res.warnings.length > 0, buttons: [{ label: 'Annulla', value: false }, { label: 'Importa e sostituisci', value: true, cls: 'primary' }] });
  if (!ok) return;
  dd.meta.modified = new Date().toISOString();
  replaceState(dd, 'Importazione completata: ' + plural(dd.components.length, 'componente', 'componenti') + ', ' + plural(dd.interfaces.length, 'interfaccia', 'interfacce') + ', ' + plural(dd.cables.length, 'cavo', 'cavi'));
  if (ui.section === 'board') fitView(); else ui.fitted = true;
}

/* =====================================================================
   20. IMPOSTAZIONI (nome progetto e liste di valori)
   ===================================================================== */
async function openSettings() {
  const nameIn = h('input', { class: 'inp', value: state.meta.name || '', style: { width: '100%' } });
  const areas = {};
  const grid = h('div', { class: 'settings-grid' });
  Object.keys(DEFAULT_LISTS).forEach((k) => {
    const ta = h('textarea', { class: 'inp', spellcheck: 'false' });
    ta.value = state.lists[k].join('\n');
    areas[k] = ta;
    grid.appendChild(fld(LIST_LABELS[k], ta, { hint: 'Un valore per riga' }));
  });
  const ok = await showModal({
    title: 'Impostazioni', wide: true,
    body: [fld('Nome del progetto / schema', nameIn), h('div', { style: { height: '12px' } }),
      h('p', { class: 'muted' }, 'Liste di valori usate nei menu a tendina. I valori già assegnati agli oggetti restano validi anche se rimossi dall’elenco.'), grid],
    buttons: [{ label: 'Annulla', value: false }, {
      label: 'Salva impostazioni', value: true, cls: 'primary',
      validate: () => {
        for (const k of Object.keys(areas)) {
          if (!areas[k].value.split('\n').map((s) => s.trim()).filter(Boolean).length) { toast('La lista “' + LIST_LABELS[k] + '” non può essere vuota.', 'err'); return false; }
        }
        return true;
      }
    }]
  });
  if (!ok) return;
  commit((st) => {
    st.meta.name = nameIn.value.trim() || 'Schema senza nome';
    Object.keys(areas).forEach((k) => { st.lists[k] = Array.from(new Set(areas[k].value.split('\n').map((s) => s.trim()).filter(Boolean))); });
  }, 'Impostazioni salvate');
}
function showErrorLog() {
  const errs = window.__idvErrors || [];
  if (!errs.length) return;
  showModal({
    title: 'Errori JavaScript rilevati', wide: true,
    body: [h('p', null, 'L’applicazione ha intercettato ' + plural(errs.length, 'errore', 'errori') + '. I dati salvati non sono stati alterati dalle operazioni fallite.'),
      h('div', { class: 'err-log' }, errs.map((e) => '[' + e.time + '] ' + e.message + (e.detail ? '\n   ' + e.detail.split('\n').slice(0, 4).join('\n   ') : '')).join('\n\n'))],
    buttons: [{ label: 'Chiudi', value: false }, { label: 'Azzera errori', value: true, cls: 'primary' }]
  }).then((r) => {
    if (r) { errs.length = 0; window.__idvPaintStatus(); }
  });
}

/* =====================================================================
   21. NAVIGAZIONE, RENDERING GENERALE, SCORCIATOIE
   ===================================================================== */
function positionPanel() {
  const tb = qs('#sec-board .board-toolbar');
  byId('sidePanel').style.top = ui.section === 'board' && tb ? tb.offsetHeight + 'px' : '0';
}
function showSection(name) {
  if (!byId('sec-' + name)) return;
  ui.section = name;
  positionPanel();
  qsa('#mainNav button').forEach((b) => b.classList.toggle('active', b.dataset.section === name));
  qsa('main > .section').forEach((s) => s.classList.toggle('active', s.id === 'sec-' + name));
  renderSection(name);
  if (name === 'board') {
    if (ui.fitted) fitView(); else applyView();
  }
  saveUi();
}
function renderSection(name) {
  if (!state) return;
  if (name === 'board') renderBoard();
  else if (name === 'dashboard') renderDashboard();
  else renderTableSection(name);
}
function renderNav() {
  const counts = {
    groups: state.groups.length, components: state.components.length, interfaces: state.interfaces.length,
    cables: state.cables.length, requirements: state.requirements.length
  };
  qsa('[data-count]').forEach((el) => {
    const k = el.dataset.count;
    if (k === 'issues') {
      const n = issues.filter((i) => i.sev !== 'info').length;
      const e = issues.filter((i) => i.sev === 'error').length;
      el.textContent = String(n);
      el.classList.toggle('alert', e > 0);
      el.title = e + ' errori, ' + (n - e) + ' avvisi';
    } else el.textContent = String(counts[k]);
  });
  byId('projectName').textContent = state.meta.name || '';
  byId('projectName').title = state.meta.name || '';
  byId('btnUndo').disabled = !history.past.length;
  byId('btnRedo').disabled = !history.future.length;
  const dl = byId('boardFindList');
  dl.innerHTML = '';
  state.components.slice().sort((a, b) => cmpNat(a.id, b.id)).forEach((c) => dl.appendChild(h('option', { value: c.id }, c.name)));
}
function renderAll() {
  renderNav();
  renderSection(ui.section);
}
function isTyping(e) {
  const t = e.target;
  return t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
}
function setupGlobalHandlers() {
  qsa('#mainNav button').forEach((b) => b.addEventListener('click', () => showSection(b.dataset.section)));
  byId('btnUndo').addEventListener('click', undo);
  byId('btnRedo').addEventListener('click', redo);
  byId('btnExport').addEventListener('click', exportJson);
  byId('btnImport').addEventListener('click', () => byId('fileImport').click());
  byId('fileImport').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (file) importJsonFile(file);
  });
  byId('btnSettings').addEventListener('click', openSettings);
  byId('btnReset').addEventListener('click', async () => {
    const r = await confirmDialog({
      title: 'Ripristinare lo schema dimostrativo?',
      body: [h('p', null, 'Tutti i dati attuali (componenti, porte, interfacce, cavi, requisiti e posizioni) verranno sostituiti con lo schema di esempio.'),
        h('p', { class: 'muted' }, 'Suggerimento: esporta prima i dati in JSON se vuoi conservarli. L’operazione può comunque essere annullata con “Annulla”.')],
      confirmLabel: 'Ripristina esempio', danger: true
    });
    if (!r.ok) return;
    replaceState(buildDemo(), 'Schema dimostrativo ripristinato');
    ui.fitted = true;
    if (ui.section === 'board') fitView();
  });
  byId('appStatus').addEventListener('click', showErrorLog);
  byId('spClose').addEventListener('click', () => requestClosePanel());
  byId('modalBack').addEventListener('mousedown', (e) => { if (e.target === byId('modalBack')) closeModal(null); });
  // clic su chip/pulsanti con data-open="tipo:uid" in qualunque vista
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-open]');
    if (!el) return;
    e.preventDefault();
    e.stopPropagation();
    const i = el.dataset.open.indexOf(':');
    openObject(el.dataset.open.slice(0, i), el.dataset.open.slice(i + 1));
  }, true);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (isModalOpen()) { e.preventDefault(); closeModal(null); return; }
      if (drag && drag.type === 'connect') { drag = null; B.temp.innerHTML = ''; B.svg.classList.remove('connecting'); return; }
      if (panelCtx) { e.preventDefault(); requestClosePanel(); return; }
      if (ui.selected && ui.section === 'board') { ui.selected = null; renderBoard(); }
      return;
    }
    if (isModalOpen()) return;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && !isTyping(e)) {
      const k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
      if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); return; }
    }
    if (mod && e.key.toLowerCase() === 's' && panelCtx) { e.preventDefault(); panelSave(); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && !isTyping(e) && ui.section === 'board' && ui.selected && !panelCtx) {
      if (['component', 'interface', 'cable', 'group'].includes(ui.selected.kind)) { e.preventDefault(); deleteObject(ui.selected.kind, ui.selected.uid); }
    }
  });
  window.addEventListener('beforeunload', () => { saveUi(); });
  window.addEventListener('resize', positionPanel);
}

/* =====================================================================
   22. AVVIO (solo a DOM disponibile)
   ===================================================================== */
function init() {
  try {
    const hadUi = loadUi();
    const loaded = loadModel();
    state = loaded.data;
    rebuildIndex();
    computeIssues();
    if (loaded.source !== 'storage') saveModel();
    setupBoard();
    buildTableSections();
    setupGlobalHandlers();
    if (!hadUi) ui.fitted = true;
    renderNav();
    showSection(ui.section);
    window.__idvReady = true;
    window.__idvPaintStatus();
    if (loaded.source === 'invalid') toast('I dati salvati non erano validi (' + (loaded.detail || '') + '): caricato lo schema dimostrativo.', 'warn', 9000);
    else if (loaded.source === 'demo') toast('Schema dimostrativo caricato. Le modifiche vengono salvate automaticamente nel browser.', 'info', 5000);
  } catch (err) {
    if (window.__idvRecordError) window.__idvRecordError('Inizializzazione non riuscita: ' + (err && err.message ? err.message : err), err && err.stack);
    console.error(err);
  }
}
// API di sola lettura per diagnostica da console
window.IDV = { get state() { return state; }, get issues() { return issues; }, ui };

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();
</script>
