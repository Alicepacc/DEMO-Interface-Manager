function compGeom(c, showPorts) {
  if (showPorts === undefined) showPorts = ui.showPorts;
  const idW = textW(c.id || '?', F.idb) + 12;
  let w = Math.max(textW(c.name || '(senza nome)', F.name) + idW + 34,
    textW(c.domain || '', F.meta) + 40, textW('Owner: ' + (c.owner || ''), F.meta) + 30);
  const portY = new Map();
  if (showPorts) {
    c.ports.forEach((p, i) => {
      w = Math.max(w, textW(p.id, F.portId) + textW('  ' + (p.label || ''), F.port) + textW(portTag(p), F.ptype) + 60);
      portY.set(p.uid, BG.HEAD + 3 + i * BG.ROW + BG.ROW / 2);
    });
  }
  w = clamp(Math.ceil(w / 10) * 10, BG.MINW, BG.MAXW);
  const hgt = showPorts ? BG.HEAD + 3 + Math.max(c.ports.length, 1) * BG.ROW + BG.PADB : BG.HEAD;
  return { uid: c.uid, x: Number(c.x) || 0, y: Number(c.y) || 0, w, h: hgt, idW, portY, showPorts };
}
function geomMap(showPorts) {
  const m = new Map();
  state.components.forEach((c) => m.set(c.uid, compGeom(c, showPorts)));
  return m;
}
function portTag(p) {
  const a = PORT_ABBR[p.type] || (p.type ? String(p.type).slice(0, 3).toUpperCase() : '');
  const d = DIR_ABBR[p.direction] || '';
  return d ? a + ' · ' + d : a;
}
function anchorPoint(geom, portUid, side) {
  const e = portEntry(portUid);
  if (!e) return null;
  const g = geom.get(e.comp.uid);
  if (!g) return null;
  const y = g.showPorts && g.portY.has(portUid) ? g.y + g.portY.get(portUid) : g.y + BG.HEAD / 2;
  return { x: side === 'R' ? g.x + g.w : g.x, y };
}
function sidesFor(gA, gB) {
  if (gA.x + gA.w + BG.GAP <= gB.x) return ['R', 'L'];
  if (gB.x + gB.w + BG.GAP <= gA.x) return ['L', 'R'];
  return null;
}
function linkRects(geom) {
  const out = [];
  geom.forEach((g) => out.push({ x0: g.x, y0: g.y, x1: g.x + g.w, y1: g.y + g.h, uid: g.uid }));
  return out;
}
const r1 = (v) => Math.round(v * 10) / 10;
const q2 = (v) => Math.round(v * 2) / 2;

/* =====================================================================
   8b. INSTRADAMENTO ORTOGONALE AUTOMATICO
   - griglia ortogonale sparsa: bordi dei blocchi (con distanza di rispetto),
     linee mediane dei canali fra i blocchi, quote delle porte e dei percorsi esistenti;
   - ricerca A* con costi per lunghezza, piegature, incroci, sovrapposizioni
     e linee troppo vicine ai blocchi;
   - percorsi dello stesso fascio (cavi della stessa interfaccia) affiancati;
   - separazione dei segmenti paralleli (nudging) nell'ordine che minimizza gli incroci;
   - ventaglio ordinato dei collegamenti che terminano sulla stessa porta;
   - salti di linea (hop) agli incroci inevitabili.
   ===================================================================== */
// M: distanza minima dai blocchi · costi: piegatura, incrocio, sovrapposizione, preferenza per l'asse dei canali
const RT = { M: 18, BEND: 36, CROSS: 160, OVERLAP: 0.6, SIDE_ALT: 110, MAXEXP: 150000, SP_IF: 10, SP_CBL: 7, R: 5, HOP: 4.5,
  PEN_EDGE: 0.45, PEN_LANE: 0.07, PEN_RING: 0.2, LANE: 36 };

/* Collegamenti della vista: interfacce, oppure cavi + interfacce senza cavi (fantasma) */
function modeLinks(mode) {
  const out = [];
  const add = (key, kind, obj, pA, pB, bundle) => {
    const eA = portEntry(pA), eB = portEntry(pB);
    if (!eA || !eB || pA === pB) return;
    out.push({ key, kind, obj, pA, pB, cA: eA.comp.uid, cB: eB.comp.uid, bundle });
  };
  if (mode === 'interfaces') state.interfaces.forEach((f) => add(f.uid, 'interface', f, f.portA, f.portB, f.uid));
  else {
    state.cables.forEach((c) => add(c.uid, 'cable', c, c.portA, c.portB, 'b:' + (c.ifaceUid || c.uid)));
    // interfacce senza cavi: "fantasma" se la categoria prevede cavi, altrimenti collegamento non cablato
    // (meccanico, fluidico…) disegnato nello stile della propria categoria
    state.interfaces.forEach((f) => {
      if (!(idx.cablesByIface.get(f.uid) || []).length) add('g:' + f.uid, 'ghost', f, f.portA, f.portB, 'b:' + f.uid);
    });
    out.forEach((L) => { if (L.kind === 'ghost') L.noCable = !categoryNeedsCables(L.obj.category); });
  }
  return out;
}
/* Lato imposto della porta sul diagramma ('L' | 'R'), oppure null se automatico */
function portSide(uid) {
  const e = portEntry(uid);
  return e && (e.port.side === 'L' || e.port.side === 'R') ? e.port.side : null;
}
/* Formato memorizzato: {sA, sB, pts:[[x,y],...], manual} */
function sanitizeRoute(r) {
  if (!r || typeof r !== 'object' || Array.isArray(r)) return null;
  if ((r.sA !== 'L' && r.sA !== 'R') || (r.sB !== 'L' && r.sB !== 'R')) return null;
  if (!Array.isArray(r.pts) || r.pts.length < 2 || r.pts.length > 400) return null;
  const pts = [];
  for (const p of r.pts) {
    if (!Array.isArray(p) || p.length !== 2 || !Number.isFinite(p[0]) || !Number.isFinite(p[1])) return null;
    pts.push([p[0], p[1]]);
  }
  const out = { sA: r.sA, sB: r.sB, pts };
  if (r.manual) out.manual = true;
  return out;
}
function parseRoute(r) {
  const s = sanitizeRoute(r);
  return s ? { sA: s.sA, sB: s.sB, manual: !!s.manual, pts: s.pts.map((p) => ({ x: p[0], y: p[1] })) } : null;
}
function serializeRoute(r) {
  const o = { sA: r.sA, sB: r.sB, pts: r.pts.map((p) => [r1(p.x), r1(p.y)]) };
  if (r.manual) o.manual = true;
  return o;
}
function simplifyPts(pts) {
  const out = [];
  pts.forEach((p) => {
    const q = { x: p.x, y: p.y };
    const last = out[out.length - 1];
    if (last && Math.abs(last.x - q.x) < 0.05 && Math.abs(last.y - q.y) < 0.05) return;
    if (out.length >= 2) {
      const a = out[out.length - 2], b = last;
      const colX = Math.abs(a.x - b.x) < 0.05 && Math.abs(b.x - q.x) < 0.05;
      const colY = Math.abs(a.y - b.y) < 0.05 && Math.abs(b.y - q.y) < 0.05;
      if (colX || colY) { out[out.length - 1] = q; return; }
    }
    out.push(q);
  });
  return out;
}
function segHitsRects(p, q, rects) {
  const x0 = Math.min(p.x, q.x), x1 = Math.max(p.x, q.x), y0 = Math.min(p.y, q.y), y1 = Math.max(p.y, q.y);
  for (const r of rects) {
    if (x1 > r.x0 + 0.5 && x0 < r.x1 - 0.5 && y1 > r.y0 + 0.5 && y0 < r.y1 - 0.5) return true;
  }
  return false;
}
/* Un percorso memorizzato resta valido se termina sulle porte giuste, è ortogonale,
   esce dai blocchi in orizzontale e non attraversa alcun blocco. */
function routeValid(r, L, geom, rects) {
  const pts = r.pts, n = pts.length;
  if (n < 2) return false;
  const fA = portSide(L.pA), fB = portSide(L.pB);
  if ((fA && r.sA !== fA) || (fB && r.sB !== fB)) return false;
  const a = anchorPoint(geom, L.pA, r.sA), b = anchorPoint(geom, L.pB, r.sB);
  if (!a || !b) return false;
  const tol = BG.ROW / 2 - 1;
  if (Math.abs(pts[0].x - a.x) > 0.6 || Math.abs(pts[0].y - a.y) > tol) return false;
  if (Math.abs(pts[n - 1].x - b.x) > 0.6 || Math.abs(pts[n - 1].y - b.y) > tol) return false;
  for (let k = 0; k < n - 1; k++) {
    if (Math.abs(pts[k].x - pts[k + 1].x) > 0.05 && Math.abs(pts[k].y - pts[k + 1].y) > 0.05) return false;
  }
  const sgA = r.sA === 'R' ? 1 : -1, sgB = r.sB === 'R' ? 1 : -1;
  if (Math.abs(pts[1].y - pts[0].y) > 0.05 || (pts[1].x - pts[0].x) * sgA < 4) return false;
  if (Math.abs(pts[n - 2].y - pts[n - 1].y) > 0.05 || (pts[n - 2].x - pts[n - 1].x) * sgB < 4) return false;
  for (let k = 0; k < n - 1; k++) if (segHitsRects(pts[k], pts[k + 1], rects)) return false;
  return true;
}
function lowerBound(arr, v) {
  let lo = 0, hi = arr.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] < v) lo = m + 1; else hi = m; }
  return lo;
}
/* Griglia ortogonale sparsa (variante della griglia di Hanan) con nodi e archi bloccati dai blocchi */
function buildGrid(rects, extraXs, extraYs) {

        else s.att.push({ at: p[pi].x, dir: Math.sign(p[pj].y - p[pi].y) });

    const p = m.s.it.pts;
    if (m.s.o === 'V') { p[m.s.k].x = m.nc; p[m.s.k + 1].x = m.nc; }

    if (Math.abs(seq[k].y - y0) > 0.05) return { dir: Math.sign(seq[k].y - y0), dist: Math.abs(seq[k - 1].x - seq[0].x) };
  }

function fanOut(items, geom) {
  const ends = new Map();
  items.forEach((it) => {
    mpush(ends, it.L.pA + ':' + it.sA, { it, end: 0, port: it.L.pA, side: it.sA });
    mpush(ends, it.L.pB + ':' + it.sB, { it, end: 1, port: it.L.pB, side: it.sB });
  });
  ends.forEach((list) => {
    const a = anchorPoint(geom, list[0].port, list[0].side);
    if (!a) return;
    const n = list.length;
    list.forEach((e) => { e.d = termDesc(e.it.pts, e.end); });
    list.sort((p, q) => {
      const rank = (e) => (e.d.dir < 0 ? 0 : (e.d.dir === 0 ? 1 : 2));
      const rp = rank(p), rq = rank(q);
      if (rp !== rq) return rp - rq;
      if (rp === 0) return p.d.dist - q.d.dist;
      if (rp === 2) return q.d.dist - p.d.dist;
      return cmpNat(p.it.key, q.it.key);
    });
    const step = n > 1 ? Math.min(6, (BG.ROW - 8) / (n - 1)) : 0;

      const y = a.y + (i - (n - 1) / 2) * step;
      if (e.end === 0) e.it.tyA = y; else e.it.tyB = y;
    });

    const p = it.pts, n = p.length;
    const yA = it.tyA, yB = it.tyB;
    const straight = p.every((q) => Math.abs(q.y - p[0].y) < 0.05);

      const mx = q2((p[0].x + p[n - 1].x) / 2);

    for (let k = 0; k < n && Math.abs(p[k].y - y0) < 0.05; k++) p[k].y = yA;

function orthoPath(pts, hops) {
  const n = pts.length, R = RT.R, HR = RT.HOP;
  const rad = new Array(n).fill(0);
  for (let k = 1; k < n - 1; k++) {
    const l1 = Math.abs(pts[k].x - pts[k - 1].x) + Math.abs(pts[k].y - pts[k - 1].y);
    const l2 = Math.abs(pts[k + 1].x - pts[k].x) + Math.abs(pts[k + 1].y - pts[k].y);
    rad[k] = Math.min(R, l1 / 2, l2 / 2);
  }
  let d = 'M' + r1(pts[0].x) + ',' + r1(pts[0].y);
  for (let k = 0; k < n - 1; k++) {
    const a = pts[k], b = pts[k + 1];
    const dx = Math.sign(b.x - a.x), dy = Math.sign(b.y - a.y);
    const hx = hops && hops.get(k);
    if (hx && dy === 0) {
      (dx > 0 ? hx : hx.slice().reverse()).forEach((x) => {
        d += ' L' + r1(x - dx * HR) + ',' + r1(a.y) + ' A' + HR + ',' + HR + ' 0 0 ' + (dx > 0 ? 1 : 0) + ' ' + r1(x + dx * HR) + ',' + r1(a.y);
      });
    }
    const rr = k + 1 < n - 1 ? rad[k + 1] : 0;
    d += ' L' + r1(b.x - dx * rr) + ',' + r1(b.y - dy * rr);
    if (rr > 0) {
      const c = pts[k + 2];
      d += ' Q' + r1(b.x) + ',' + r1(b.y) + ' ' + r1(b.x + Math.sign(c.x - b.x) * rr) + ',' + r1(b.y + Math.sign(c.y - b.y) * rr);
    }
  }
  return d;
}

/* Etichette sui segmenti dei collegamenti, evitando etichette, blocchi e altre linee */
function placeRouteLabels(labels, items, rects, quick) {
  if (quick) {
    // durante il trascinamento: posizione semplice al centro del tratto più lungo
    labels.forEach((lb) => {
      const p = items[lb.li].pts;
      let bk = 0, bl = -1;
      for (let k = 0; k < p.length - 1; k++) { const l = Math.abs(p[k + 1].x - p[k].x) + Math.abs(p[k + 1].y - p[k].y); if (l > bl) { bl = l; bk = k; } }

    });

    const ox = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0);
    const oy = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);
    return ox > 0 && oy > 0 ? ox * oy : 0;
  };
  const segs = [];
  items.forEach((it, li) => {
    for (let k = 0; k < it.pts.length - 1; k++) segs.push({ li, a: it.pts[k], b: it.pts[k + 1] });
  });

    const x0 = Math.min(s.a.x, s.b.x), x1 = Math.max(s.a.x, s.b.x), y0 = Math.min(s.a.y, s.b.y), y1 = Math.max(s.a.y, s.b.y);
    return x1 >= bx.x0 && x0 <= bx.x1 && y1 >= bx.y0 && y0 <= bx.y1;
  };

  const order = labels.slice().sort((a, b) => (b.st === 'selected') - (a.st === 'selected'));
  const bundleOfLi = items.map((it) => it.bundle);
  const place = (lb) => {
    const p = items[lb.li].pts, n = p.length;
    const cands = [];
    for (let k = 0; k < n - 1; k++) {
      const a = p[k], b = p[k + 1];
      const horiz = Math.abs(a.y - b.y) < 0.05;
      const len = Math.abs(b.x - a.x) + Math.abs(b.y - a.y);
      if (len < 12) continue;

      [0.5, 0.3, 0.7].forEach((t) => {
        const x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t;

      });
    }
    if (!cands.length) cands.push({ x: p[0].x, y: p[0].y, ax: p[0].x, ay: p[0].y, pen: 0 });

    cands.forEach((c) => {
      const box = { x0: c.x - lb.w / 2 - 2, x1: c.x + lb.w / 2 + 2, y0: c.y - lb.h / 2 - 1, y1: c.y + lb.h / 2 + 1 };
      let sc = c.pen, conflicts = 0;
      placed.forEach((q) => { const o = overlap(box, q); sc += o * 25; conflicts += o; });
      rects.forEach((r) => { const o = overlap(box, { x0: r.x0 - 4, y0: r.y0 - 4, x1: r.x1 + 4, y1: r.y1 + 4 }); sc += o * 4; conflicts += o; });

      });
      if (sc < bestScore) { bestScore = sc; best = { c, box, conflicts }; }
    });

  };

    let best = place(lb);
    if (best.conflicts > 0 && lb.rest && !lb.rows) {
      // l'etichetta completa coprirebbe un blocco o un'altra etichetta: si usa il solo ID se così il conflitto
      // scompare (il tipo resta visibile nel tooltip e nelle tabelle)
      const full = { rest: lb.rest, w: lb.w };
      lb.rest = '';
      lb.w = textW(lb.idPart, F.lblId) + 12;
      const short = place(lb);
      if (short.conflicts === 0) best = short;
      else { lb.rest = full.rest; lb.w = full.w; }
    }
    lb.x = best.c.x; lb.y = best.c.y; lb.ax = best.c.ax; lb.ay = best.c.ay;
    placed.push(best.box);

function selectionContext() {
  const sel = ui.selected;
  const ctx = { linkState: () => '', hlPorts: new Set() };
  if (!sel) return ctx;
  const o = getObj(sel.kind, sel.uid);
  if (!o) return ctx;
  if (sel.kind === 'interface') {
    ctx.hlPorts = new Set([o.portA, o.portB]);
    ctx.linkState = (L) => {
      if ((L.kind === 'interface' || L.kind === 'ghost') && L.obj.uid === o.uid) return 'selected';
      if (L.kind === 'cable' && L.obj.ifaceUid === o.uid) return 'selected';
      return 'dim';
    };
  } else if (sel.kind === 'cable') {
    ctx.hlPorts = new Set([o.portA, o.portB]);
    ctx.linkState = (L) => {
      if (L.kind === 'cable' && L.obj.uid === o.uid) return 'selected';
      if (L.kind === 'interface' && L.obj.uid === o.ifaceUid) return 'related';
      return 'dim';
    };
  } else if (sel.kind === 'component') {
    ctx.linkState = (L) => (L.cA === o.uid || L.cB === o.uid ? 'related' : 'dim');
  } else if (sel.kind === 'port') {
    ctx.hlPorts = new Set([o.uid]);
    ctx.linkState = (L) => (L.pA === o.uid || L.pB === o.uid ? 'related' : 'dim');
  } else if (sel.kind === 'group') {
    ctx.linkState = (L) => {
      const a = idx.comp.get(L.cA), b = idx.comp.get(L.cB);
      return (a && a.groupUid === o.uid) || (b && b.groupUid === o.uid) ? '' : 'dim';
    };
  } else if (sel.kind === 'requirement') {
    const lk = new Set((o.links || []).map((l) => l.uid));
    const ports = new Set();
    (o.links || []).forEach((l) => {
      if (l.kind === 'port') ports.add(l.uid);
      const x = getObj(l.kind, l.uid);
      if (x && (l.kind === 'interface' || l.kind === 'cable')) { ports.add(x.portA); ports.add(x.portB); }
    });
    ctx.hlPorts = ports;
    ctx.linkState = (L) => {
      if (lk.has(L.obj.uid) || (L.kind === 'cable' && lk.has(L.obj.ifaceUid))) return 'selected';
      if (lk.has(L.cA) || lk.has(L.cB) || lk.has(L.pA) || lk.has(L.pB)) return 'related';
      return 'dim';
    };
  }
  return ctx;
}

   10. DIPENDENZE ED ELIMINAZIONE A CASCATA
   ===================================================================== */
function computeDependents(kind, uids) {
  const S = new Set(uids);
  const compSet = new Set(), portSet = new Set(), ifSet = new Set(), cblSet = new Set();
  if (kind === 'component') uids.forEach((u) => { compSet.add(u); const c = idx.comp.get(u); if (c) c.ports.forEach((p) => portSet.add(p.uid)); });
  if (kind === 'port') uids.forEach((u) => portSet.add(u));
  if (kind === 'interface') uids.forEach((u) => ifSet.add(u));
  if (kind === 'cable') uids.forEach((u) => cblSet.add(u));
  state.interfaces.forEach((f) => {
    if (compSet.has(f.compA) || compSet.has(f.compB) || portSet.has(f.portA) || portSet.has(f.portB)) ifSet.add(f.uid);
  });
  state.cables.forEach((c) => {
    if (ifSet.has(c.ifaceUid) || compSet.has(c.compA) || compSet.has(c.compB) || portSet.has(c.portA) || portSet.has(c.portB)) cblSet.add(c.uid);
  });
  const removed = new Set([...compSet, ...portSet, ...ifSet, ...cblSet]);
  const reqs = state.requirements
    .filter((r) => (r.links || []).some((l) => removed.has(l.uid)))
    .map((r) => ({ req: r, orphan: (r.links || []).every((l) => removed.has(l.uid)) }));
  return {
    kind, uids,
    ports: kind === 'component' ? [...portSet] : [],
    interfaces: [...ifSet].filter((u) => !(kind === 'interface' && S.has(u))),
    cables: [...cblSet].filter((u) => !(kind === 'cable' && S.has(u))),
    requirements: reqs,
    components: kind === 'group' ? state.components.filter((c) => S.has(c.groupUid)).map((c) => c.uid) : [],
    sets: { compSet, portSet, ifSet, cblSet, removed }
  };
}
function hasDependents(dep) {
  return dep.interfaces.length || dep.cables.length || dep.requirements.length || dep.components.length || dep.ports.length;
}
function applyCascade(st, dep, opts) {
  const { compSet, portSet, ifSet, cblSet, removed } = dep.sets;
  if (compSet.size) st.components = st.components.filter((c) => !compSet.has(c.uid));
  if (portSet.size) st.components.forEach((c) => { c.ports = c.ports.filter((p) => !portSet.has(p.uid)); });
  if (ifSet.size) st.interfaces = st.interfaces.filter((f) => !ifSet.has(f.uid));
  if (cblSet.size) st.cables = st.cables.filter((c) => !cblSet.has(c.uid));
  if (removed.size) st.requirements.forEach((r) => { r.links = (r.links || []).filter((l) => !removed.has(l.uid)); });
  if (opts && opts.deleteOrphanReqs) {
    const orphans = new Set(dep.requirements.filter((x) => x.orphan).map((x) => x.req.uid));
    st.requirements = st.requirements.filter((r) => !orphans.has(r.uid));
  }
}
function depList(title, cls, items) {
  if (!items.length) return null;
  return h('div', { class: 'dep-block ' + cls }, h('h4', null, title + ' (' + items.length + ')'),
    h('ul', null, items.slice(0, 60).map((t) => h('li', null, t)), items.length > 60 ? h('li', null, '… e altri ' + (items.length - 60)) : null));
}
function dependentsView(dep, future) {
  const verb = future ? 'verranno eliminati' : 'verranno eliminati';
  const lbl = (k, u) => objLabel(k, u) || u;
  return [

    depList('Interfacce logiche che ' + verb.replace('eliminati', 'eliminate'), 'del', dep.interfaces.map((u) => lbl('interface', u))),
    depList('Cavi che ' + verb, 'del', dep.cables.map((u) => lbl('cable', u))),
    depList('Requisiti che perderanno il collegamento (il requisito resta)', 'unlink', dep.requirements.map((x) => x.req.id + ' — ' + x.req.text + (x.orphan ? '  [resterà senza collegamenti]' : ''))),
    depList('Componenti che verranno rimossi dal gruppo (non eliminati)', 'unlink', dep.components.map((u) => lbl('component', u)))
  ].filter(Boolean);
}
async function deleteObject(kind, uid) {
  const o = getObj(kind, uid);
  if (!o) return false;
  const dep = computeDependents(kind, [uid]);
  const nm = kind === 'port' ? portFull(uid) : o.id;
  const body = [h('p', null, 'Stai per eliminare ', h('b', null, KIND_IT[kind].toLowerCase() + ' ' + nm),
    (o.name ? ' (' + o.name + ')' : '') + '. L’operazione può essere annullata con “Annulla” (Ctrl+Z).')];
  const deps = dependentsView(dep);

function linkTargetOptions(excludeUids) {
  const ex = new Set(excludeUids);
  const byIdSort = (a, b) => cmpNat(a.id, b.id);
  const ifs = state.interfaces.slice().sort(byIdSort).filter((f) => !ex.has(f.uid)).map((f) => ({ value: 'interface:' + f.uid, label: objLabel('interface', f.uid) }));
  const cbs = state.cables.slice().sort(byIdSort).filter((c) => !ex.has(c.uid)).map((c) => ({ value: 'cable:' + c.uid, label: objLabel('cable', c.uid) }));
  const cps = state.components.slice().sort(byIdSort).filter((c) => !ex.has(c.uid)).map((c) => ({ value: 'component:' + c.uid, label: objLabel('component', c.uid) }));
  const pts = [];
  state.components.slice().sort(byIdSort).forEach((c) => c.ports.forEach((p) => { if (!ex.has(p.uid)) pts.push({ value: 'port:' + p.uid, label: objLabel('port', p.uid) }); }));
  const out = [{ value: '', label: '— seleziona oggetto da collegare —' }];
  if (ifs.length) out.push({ group: 'Interfacce', options: ifs });
  if (cbs.length) out.push({ group: 'Cavi', options: cbs });
  if (cps.length) out.push({ group: 'Componenti', options: cps });
  if (pts.length) out.push({ group: 'Porte', options: pts });
  return out;
}

      const clean = stripDraft(d);
      clean.id = str(clean.id).trim();

      const created = placeNewComponents(d._newComps.map((c) => Object.assign(clone(c), { groupUid: clean.uid })), d._members);
      return commit((st) => {
        const i = st.groups.findIndex((g) => g.uid === clean.uid);
        if (i >= 0) st.groups[i] = clean; else st.groups.push(clean);
        st.components.forEach((c) => {
          if (members.has(c.uid)) c.groupUid = clean.uid;
          else if (c.groupUid === clean.uid) c.groupUid = null;
        });
        created.forEach((c) => st.components.push(c));
      }, (isNew ? 'Gruppo ' + clean.id + ' creato' : 'Gruppo ' + clean.id + ' aggiornato') + (created.length ? ' con ' + plural(created.length, 'nuovo componente', 'nuovi componenti') : ''));
    }

/* Posiziona i nuovi componenti sotto ai membri del gruppo (o al centro della vista), senza sovrapposizioni */
function placeNewComponents(list, memberUids) {
  if (!list.length) return list;
  const geom = geomMap(true);
  const boxes = [];
  geom.forEach((g) => boxes.push({ x0: g.x, y0: g.y, x1: g.x + g.w, y1: g.y + g.h }));
  const mem = memberUids.map((u) => geom.get(u)).filter(Boolean);
  let x, y;
  if (mem.length) {
    x = Math.min(...mem.map((g) => g.x));
    y = Math.max(...mem.map((g) => g.y + g.h)) + 70;
  } else if (B && ui.section === 'board') {
    const r = B.svg.getBoundingClientRect();
    x = (r.width / 2 - ui.panX) / ui.zoom - 120; y = (r.height / 2 - ui.panY) / ui.zoom - 80;
  } else { const p = nextFreePosition(); x = p.x; y = p.y; }
  x = snapV(x); y = snapV(y);
  list.forEach((c) => {
    const g = compGeom(c, true);
    let cy = y;
    for (let guard = 0; guard < 400; guard++) {
      const box = { x0: x - 40, y0: cy - 50, x1: x + g.w + 40, y1: cy + g.h + 50 };
      if (!boxes.some((b) => b.x0 < box.x1 && b.x1 > box.x0 && b.y0 < box.y1 && b.y1 > box.y0)) break;
      cy += 20;
    }
    c.x = x; c.y = snapV(cy);
    boxes.push({ x0: x, y0: c.y, x1: x + g.w, y1: c.y + g.h });
    y = c.y + g.h + 60;
  });
  return list;
}

        excluded.length ? h('div', { class: 'msg-box warn' }, h('b', null, plural(excluded.length, 'requisito selezionato escluso', 'requisiti selezionati esclusi') + ' perché non condivisibili:'), h('ul', null, excluded.slice(0, 30).map((r) => h('li', null, r.id + ' — ' + (r.title || r.text))))) : null,

      buttons: [{ label: 'Annulla', value: false }, { label: 'Esporta Excel', value: true, cls: 'primary' }]

  const base = (state.meta.name || 'progetto').replace(/[^\w\-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40) || 'progetto';
  downloadBlob('Requisiti_fornitore_' + base + '_' + stamp() + '.xlsx', blob);
  toast('Esportati ' + plural(out.length, 'requisito', 'requisiti') + ' per il fornitore in Excel', 'ok');
}

  right.appendChild(h('div', { class: 'card' }, h('div', { class: 'card-head' }, 'Copertura'),

      meter('Cavi con pinout definito', cabWithPin, state.cables.length),
      meter('Cavi con entrambi i connettori', cabWithConn, state.cables.length),
      meter('Requisiti approvati o verificati', reqApproved, state.requirements.length),
      meter('Porte utilizzate', nPorts - unusedPorts, nPorts))));
  const statusCard = (title, list, statuses) => {

  right.appendChild(statusCard('Stato dei cavi', state.cables, STATUSES));
  right.appendChild(statusCard('Stato dei requisiti', state.requirements, REQ_STATUSES));
  root.appendChild(h('div', { class: 'dash-grid' }, left, right));
  root.scrollTop = scroll;

/* =====================================================================
   19. FILE SCARICATI E VALIDAZIONE DEI DATI (archivio, file di progetto)
   ===================================================================== */
function stamp() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}
function downloadFile(name, content, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
/* Normalizza e valida un oggetto dati (progetto nell'archivio, file di progetto, versione).
   I riferimenti possono essere uid interni oppure ID leggibili (es. "VCU", "J2", "IF-CTRL-01"). */
function normalizeData(raw) {
  const errors = [], warnings = [];
  let d = raw;
  if (d && typeof d === 'object' && !Array.isArray(d) && d.data && typeof d.data === 'object' && (d.format || d.schema)) {
    if (d.format && d.format !== APP.format && d.format !== APP.projectFormat) warnings.push('Formato dichiarato “' + d.format + '” diverso da “' + APP.format + '”: verrà comunque tentata l’importazione.');
    d = d.data;
  }
  if (!d || typeof d !== 'object' || Array.isArray(d)) { errors.push('Il file non contiene un oggetto JSON con i dati dello schema.'); return { errors, warnings }; }
  ['components', 'interfaces', 'cables', 'requirements'].forEach((k) => {
    if (d[k] == null) { d[k] = []; warnings.push('Elenco “' + k + '” assente: considerato vuoto.'); }
    else if (!Array.isArray(d[k])) errors.push('“' + k + '” deve essere un array.');
  });
  if (d.groups != null && !Array.isArray(d.groups)) errors.push('“groups” deve essere un array.');
  if (errors.length) return { errors, warnings };
  if (!d.components.length && !d.interfaces.length && !d.cables.length && !d.requirements.length && !(d.groups || []).length) warnings.push('Il file non contiene alcun oggetto.');

  const used = new Set();
  const takeUid = (v, prefix) => {
    const s = typeof v === 'string' && v.trim() ? v.trim() : '';
    if (s && !used.has(s)) { used.add(s); return s; }
    let u; do { u = newUid(prefix); } while (used.has(u));
    used.add(u);
    return u;
  };
  const isObj = (o) => o && typeof o === 'object' && !Array.isArray(o);
  const pick = (v, list, def) => (list.includes(v) ? v : (v == null || v === '' ? def : String(v)));
  const out = {
    schema: APP.schema,
    meta: {
      name: isObj(d.meta) && d.meta.name ? String(d.meta.name) : 'Schema importato', program: isObj(d.meta) ? str(d.meta.program) : '',
      created: (isObj(d.meta) && d.meta.created) || new Date().toISOString(), modified: (isObj(d.meta) && d.meta.modified) || new Date().toISOString(),
      modifiedBy: isObj(d.meta) ? str(d.meta.modifiedBy) : ''
    },
    lists: clone(DEFAULT_LISTS), groups: [], components: [], interfaces: [], cables: [], requirements: []
  };
  const cleanList = (arr) => Array.from(new Set(arr.map(String).map((x) => x.trim()).filter(Boolean)));
  if (isObj(d.lists)) {
    SIMPLE_LISTS.forEach((k) => {
      if (Array.isArray(d.lists[k])) { const v = cleanList(d.lists[k]); if (v.length) out.lists[k] = v; }
    });
    // schema 1: la vecchia lista "ifTypes" diventa suggerimento di protocollo
    if (Array.isArray(d.lists.ifTypes)) out.lists.protocols = cleanList(out.lists.protocols.concat(d.lists.ifTypes.filter((t) => !['Other', 'Mechanical', 'Power DC', 'Controllo discreto'].includes(t))));
    if (Array.isArray(d.lists.ifCategories)) {
      const cats = [];
      d.lists.ifCategories.forEach((c) => {
        if (!isObj(c) || !str(c.name).trim() || cats.some((x) => x.name === str(c.name).trim())) return;
        cats.push({
          name: str(c.name).trim(), color: /^#[0-9a-f]{3,8}$/i.test(str(c.color)) ? c.color : CATEGORY_COLORS[cats.length % CATEGORY_COLORS.length],
          cables: c.cables !== false, subtypes: Array.isArray(c.subtypes) ? cleanList(c.subtypes) : []
        });
      });
      if (cats.length) out.lists.ifCategories = cats;
    }
  }
  const ensureCategory = (name, sub) => {
    let c = out.lists.ifCategories.find((x) => x.name === name);
    if (!c) {
      c = { name, color: CATEGORY_COLORS[out.lists.ifCategories.length % CATEGORY_COLORS.length], cables: true, subtypes: [] };
      out.lists.ifCategories.push(c);
      warnings.push('Categoria di interfaccia “' + name + '” non presente nelle impostazioni: aggiunta automaticamente.');
    }
    if (sub && !c.subtypes.includes(sub)) c.subtypes.push(sub);
  };
  let migratedIf = 0;
  (d.groups || []).forEach((g, i) => {
    if (!isObj(g)) { errors.push('Gruppo #' + (i + 1) + ': non è un oggetto.'); return; }
    if (!str(g.id).trim()) errors.push('Gruppo #' + (i + 1) + ': ID mancante.');
    out.groups.push({ uid: takeUid(g.uid, 'g'), id: str(g.id).trim(), name: str(g.name), description: str(g.description), color: /^#[0-9a-f]{3,8}$/i.test(str(g.color)) ? g.color : GROUP_COLORS[i % GROUP_COLORS.length].v, owner: str(g.owner) || 'Da assegnare' });
  });
  const groupRef = (v) => { if (!v) return null; const g = out.groups.find((x) => x.uid === v) || out.groups.find((x) => eqId(x.id, v)); return g ? g.uid : v; };
  d.components.forEach((c, i) => {
    if (!isObj(c)) { errors.push('Componente #' + (i + 1) + ': non è un oggetto.'); return; }
    if (!str(c.id).trim()) errors.push('Componente #' + (i + 1) + ': ID mancante.');
    if (c.ports != null && !Array.isArray(c.ports)) errors.push('Componente ' + (c.id || '#' + (i + 1)) + ': “ports” deve essere un array.');
    const ports = (Array.isArray(c.ports) ? c.ports : []).map((p, j) => {
      if (!isObj(p)) { errors.push('Componente ' + c.id + ', porta #' + (j + 1) + ': non è un oggetto.'); return null; }
      if (!str(p.id).trim()) errors.push('Componente ' + c.id + ', porta #' + (j + 1) + ': ID mancante.');
      return { uid: takeUid(p.uid, 'p'), id: str(p.id).trim(), label: str(p.label), type: pick(p.type, out.lists.portTypes, 'Other'), direction: pick(p.direction, DIRECTIONS, 'Not applicable'), side: ['L', 'R'].includes(p.side) ? p.side : 'auto', notes: str(p.notes) };
    }).filter(Boolean);
    const hasPos = Number.isFinite(Number(c.x)) && Number.isFinite(Number(c.y)) && c.x !== null && c.y !== null && c.x !== '' && c.y !== '';
    if (!hasPos) warnings.push('Componente ' + (c.id || '#' + (i + 1)) + ': posizione assente, assegnata automaticamente.');
    const cg = groupRef(c.groupUid || c.group || null);
    if (cg && !out.groups.some((g) => g.uid === cg)) warnings.push('Componente ' + c.id + ': gruppo “' + cg + '” non trovato.');
    out.components.push({
      uid: takeUid(c.uid, 'c'), id: str(c.id).trim(), name: str(c.name), description: str(c.description),
      domain: pick(c.domain, out.lists.domains, 'Altro'), owner: pick(c.owner, out.lists.owners, 'Da assegnare'), supplier: str(c.supplier),
      status: pick(c.status, STATUSES, 'Da verificare'),
      x: hasPos ? Number(c.x) : 40 + (i % 4) * 340, y: hasPos ? Number(c.y) : 40 + Math.floor(i / 4) * 300,
      groupUid: cg, ports
    });
  });
  const compRef = (v) => { if (v == null || v === '') return null; return out.components.find((c) => c.uid === v) || out.components.find((c) => eqId(c.id, v)) || null; };
  const portRef = (comp, v) => {
    if (v == null || v === '') return null;
    if (comp) { const p = comp.ports.find((x) => x.uid === v) || comp.ports.find((x) => eqId(x.id, v)); if (p) return p; }
    for (const c of out.components) { const p = c.ports.find((x) => x.uid === v); if (p) return p; }
    if (typeof v === 'string' && v.includes(':')) { const [ci, pi] = v.split(':'); const c = compRef(ci); if (c) return c.ports.find((x) => eqId(x.id, pi)) || null; }
    return null;
  };
  const endpoint = (o, side, label) => {
    const comp = compRef(o['comp' + side] != null ? o['comp' + side] : o['component' + side]);
    const port = portRef(comp, o['port' + side]);
    if (!comp) warnings.push(label + ': componente ' + side + ' “' + str(o['comp' + side] || o['component' + side]) + '” non trovato.');
    else if (!port) warnings.push(label + ': porta ' + side + ' “' + str(o['port' + side]) + '” non trovata nel componente ' + comp.id + '.');
    return { comp: comp ? comp.uid : str(o['comp' + side]), port: port ? port.uid : str(o['port' + side]) };
  };
  d.interfaces.forEach((f, i) => {
    if (!isObj(f)) { errors.push('Interfaccia #' + (i + 1) + ': non è un oggetto.'); return; }
    if (!str(f.id).trim()) errors.push('Interfaccia #' + (i + 1) + ': ID mancante.');
    const label = 'Interfaccia ' + (f.id || '#' + (i + 1));
    const a = endpoint(f, 'A', label), b = endpoint(f, 'B', label);
    let category = str(f.category).trim(), subtype = str(f.subtype).trim(), protocol = str(f.protocol).trim();
    if (!category && f.type != null && str(f.type).trim()) {
      const m = LEGACY_IF_TYPES[str(f.type).trim()];
      if (m) { category = m[0]; subtype = subtype || m[1]; protocol = protocol || m[2]; }
      else { category = 'Funzionale'; protocol = protocol || str(f.type).trim(); }
      migratedIf++;
    }
    if (!category) category = 'Funzionale';
    ensureCategory(category, subtype);
    out.interfaces.push({ uid: takeUid(f.uid, 'i'), id: str(f.id).trim(), name: str(f.name), compA: a.comp, portA: a.port, compB: b.comp, portB: b.port, category, subtype, protocol, description: str(f.description), owner: pick(f.owner, out.lists.owners, 'Da assegnare'), status: pick(f.status, STATUSES, 'Da verificare') });
  });
  if (migratedIf) warnings.push(plural(migratedIf, 'interfaccia convertita', 'interfacce convertite') + ' dal vecchio campo “Tipo / protocollo” a categoria, sottotipo e protocollo: verificare la classificazione.');
  const ifRef = (v) => out.interfaces.find((f) => f.uid === v) || out.interfaces.find((f) => eqId(f.id, v)) || null;
  d.cables.forEach((c, i) => {
    if (!isObj(c)) { errors.push('Cavo #' + (i + 1) + ': non è un oggetto.'); return; }
    if (!str(c.id).trim()) errors.push('Cavo #' + (i + 1) + ': ID mancante.');
    const label = 'Cavo ' + (c.id || '#' + (i + 1));
    const fRaw = c.ifaceUid != null ? c.ifaceUid : (c.interface != null ? c.interface : c.interfaceId);
    const f = ifRef(fRaw);
    if (!f) warnings.push(label + ': interfaccia “' + str(fRaw) + '” non trovata.');
    const src = Object.assign({}, c);
    if (f) ['A', 'B'].forEach((s) => { if (src['comp' + s] == null && src['component' + s] == null) { src['comp' + s] = f['comp' + s]; src['port' + s] = f['port' + s]; } });
    const a = endpoint(src, 'A', label), b = endpoint(src, 'B', label);
    let pinout = [];
    if (Array.isArray(c.pinout)) pinout = c.pinout.filter(isObj).map((r) => ({ pinA: str(r.pinA), sigA: str(r.sigA), pinB: str(r.pinB), sigB: str(r.sigB), wire: str(r.wire) }));
    else if (typeof c.pinout === 'string' && c.pinout.trim()) pinout = c.pinout.split(/[;\n]/).map((s) => s.trim()).filter(Boolean).map((s) => { const [x, y] = s.split(/→|->/); return { pinA: '', sigA: str(x).trim(), pinB: '', sigB: str(y).trim(), wire: '' }; });
    const len = c.length === '' || c.length == null ? null : Number(c.length);
    if (c.length != null && c.length !== '' && !Number.isFinite(len)) warnings.push(label + ': lunghezza non numerica ignorata.');
    out.cables.push({
      uid: takeUid(c.uid, 'w'), id: str(c.id).trim(), ifaceUid: f ? f.uid : str(fRaw), name: str(c.name),
      compA: a.comp, portA: a.port, compB: b.comp, portB: b.port, type: str(c.type), connA: str(c.connA), connB: str(c.connB),
      pinout, length: Number.isFinite(len) ? len : null, lengthUnit: pick(c.lengthUnit, LENGTH_UNITS, 'm'),
      shielding: pick(c.shielding, SHIELDING, 'None'), partNumber: str(c.partNumber), notes: str(c.notes), status: pick(c.status, STATUSES, 'Da verificare')
    });
  });
  const resolveLink = (l, label) => {
    if (!isObj(l)) { warnings.push(label + ': collegamento non valido ignorato.'); return null; }
    const kind = ['interface', 'cable', 'component', 'port'].includes(l.kind) ? l.kind : null;
    if (!kind) { warnings.push(label + ': tipo di collegamento “' + str(l.kind) + '” non riconosciuto.'); return null; }
    const v = l.uid != null ? l.uid : (l.id != null ? l.id : l.ref);
    let o = null;
    if (kind === 'interface') o = ifRef(v);
    else if (kind === 'cable') o = out.cables.find((c) => c.uid === v) || out.cables.find((c) => eqId(c.id, v));
    else if (kind === 'component') o = compRef(v);
    else o = portRef(null, v);
    if (!o) { warnings.push(label + ': ' + KIND_IT[kind].toLowerCase() + ' “' + str(v) + '” non trovato.'); return { kind, uid: str(v) }; }
    return { kind, uid: o.uid };
  };
  d.requirements.forEach((r, i) => {
    if (!isObj(r)) { errors.push('Requisito #' + (i + 1) + ': non è un oggetto.'); return; }
    if (!str(r.id).trim()) errors.push('Requisito #' + (i + 1) + ': ID mancante.');
    const label = 'Requisito ' + (r.id || '#' + (i + 1));
    const raws = Array.isArray(r.links) ? r.links : (r.link ? [r.link] : []);
    out.requirements.push({
      uid: takeUid(r.uid, 'r'), id: str(r.id).trim(), title: str(r.title), text: str(r.text), type: pick(r.type, REQ_TYPES, 'Interface'), origin: pick(r.origin, REQ_ORIGINS, 'System derived'), shareable: !!r.shareable,
      links: raws.map((l) => resolveLink(l, label)).filter(Boolean), method: pick(r.method, REQ_METHODS, 'Test'),
      owner: pick(r.owner, out.lists.owners, 'Da assegnare'), status: pick(r.status, REQ_STATUSES, 'Draft'), notes: str(r.notes)
    });
  });
  const dupWarn = (arr, label) => {
    const seen = new Set();
    arr.forEach((o) => { const k = normId(o.id); if (k && seen.has(k)) warnings.push(label + ' con ID duplicato: ' + o.id + '.'); seen.add(k); });
  };
  dupWarn(out.groups, 'Gruppo'); dupWarn(out.components, 'Componente'); dupWarn(out.interfaces, 'Interfaccia'); dupWarn(out.cables, 'Cavo'); dupWarn(out.requirements, 'Requisito');
  // percorsi memorizzati: accettati solo se ben formati e riferiti a collegamenti esistenti
  out.routing = { interfaces: {}, cables: {} };
  let badRoutes = 0;
  if (isObj(d.routing)) {
    ['interfaces', 'cables'].forEach((m) => {
      if (!isObj(d.routing[m])) return;
      const keys = new Set(m === 'interfaces' ? out.interfaces.map((f) => f.uid) : out.cables.map((c) => c.uid).concat(out.interfaces.map((f) => 'g:' + f.uid)));
      Object.keys(d.routing[m]).forEach((k) => {
        const r = keys.has(k) ? sanitizeRoute(d.routing[m][k]) : null;
        if (r) out.routing[m][k] = r; else badRoutes++;
      });
    });
  } else if (d.routing != null) badRoutes++;
  if (badRoutes) warnings.push(plural(badRoutes, 'percorso grafico non valido', 'percorsi grafici non validi') + ' ignorati: verranno ricalcolati automaticamente.');
  return { errors, warnings, data: out };
}

async function openSettings() {
  const nameIn = h('input', { class: 'inp', value: state.meta.name || '', maxlength: 120 });
  const progIn = h('input', { class: 'inp', value: state.meta.program || '', maxlength: 120, placeholder: 'es. Programma Y / cliente' });

  const paintCats = () => {
    catBody.innerHTML = '';
    rows.forEach((r, i) => {
      const n = r.orig ? used.get(r.orig) || 0 : 0;
      const name = h('input', { class: 'inp', value: r.name, maxlength: 40, 'aria-label': 'Nome categoria', oninput: (e) => { r.name = e.target.value; } });
      const color = h('input', { type: 'color', class: 'cat-color', value: r.color, title: 'Colore sul diagramma', oninput: (e) => { r.color = e.target.value; } });
      const cables = h('input', { type: 'checkbox', checked: r.cables, onchange: (e) => { r.cables = e.target.checked; } });
      const subs = h('textarea', { class: 'inp', rows: Math.max(3, r.subtypes.split('\n').length), spellcheck: 'false', 'aria-label': 'Sottotipi', oninput: (e) => { r.subtypes = e.target.value; } });
      subs.value = r.subtypes;
      catBody.appendChild(h('tr', null,
        h('td', null, color), h('td', null, name),
        h('td', null, h('label', { class: 'inline-check', title: 'Se attivo, l’interfaccia deve essere realizzata da almeno un cavo ed è disegnata nella vista cavi' }, cables, ' cavi')),
        h('td', null, subs),
        h('td', { class: 'small nowrap' }, plural(n, 'interfaccia', 'interfacce')),
        h('td', { class: 'act' }, h('button', {
          type: 'button', class: 'btn xs danger', disabled: n > 0 || rows.length < 2,
          title: n > 0 ? 'Categoria usata da ' + plural(n, 'interfaccia', 'interfacce') + ': riassegnale prima di eliminarla' : 'Elimina categoria',
          onclick: () => { rows.splice(i, 1); paintCats(); }
        }, '✕'))));
    });
  };
  paintCats();
  const addCat = h('button', {
    type: 'button', class: 'btn sm', onclick: () => {
      rows.push({ orig: null, name: '', color: CATEGORY_COLORS[rows.length % CATEGORY_COLORS.length], cables: true, subtypes: '' });
      paintCats();
      const inputs = catBody.querySelectorAll('tr:last-child input.inp');
      if (inputs.length) inputs[0].focus();
    }
  }, '+ Aggiungi categoria');
  // ---- liste semplici ----
  const areas = {};
  const grid = h('div', { class: 'settings-grid' });
  SIMPLE_LISTS.forEach((k) => {
    const ta = h('textarea', { class: 'inp', spellcheck: 'false' });
    ta.value = state.lists[k].join('\n');
    areas[k] = ta;
    grid.appendChild(fld(LIST_LABELS[k], ta, { hint: 'Un valore per riga' }));
  });
  const sec = (title, desc) => [h('h3', { class: 'set-title' }, title), desc ? h('p', { class: 'muted small' }, desc) : null];
  const ok = await showModal({
    title: 'Impostazioni', wide: true,
    body: [
      sec('Progetto e utente'),
      h('div', { class: 'form-grid three' },
        fld('Nome del progetto', nameIn, { required: true }),
        fld('Programma / cliente', progIn),
        fld('Il tuo nome (questo browser)', userIn, { hint: 'Registrato come autore delle modifiche e delle versioni' })),
      sec('Categorie di interfaccia e sottotipi',
        'Ogni interfaccia appartiene a una categoria (es. Elettrica) e, facoltativamente, a un sottotipo (es. Alimentazione). Puoi rinominare le categorie (le interfacce vengono aggiornate), aggiungerne di nuove e ampliare i sottotipi, uno per riga. I sottotipi già assegnati restano validi anche se rimossi dall’elenco.'),
      h('table', { class: 'mini cat-table' },
        h('thead', null, h('tr', null, ['Colore', 'Categoria', 'Realizzata con cavi', 'Sottotipi (uno per riga)', 'Uso', ''].map((t) => h('th', null, t)))), catBody),
      h('div', { class: 'row-actions' }, addCat),
      sec('Liste di valori', 'Usate nei menu a tendina e come suggerimenti. I valori già assegnati agli oggetti restano validi anche se rimossi dall’elenco.'),
      grid],
    buttons: [{ label: 'Annulla', value: false }, {
      label: 'Salva impostazioni', value: true, cls: 'primary',
      validate: () => {
        if (!nameIn.value.trim()) { toast('Il nome del progetto è obbligatorio.', 'err'); nameIn.focus(); return false; }
        const names = rows.map((r) => r.name.trim());
        if (!rows.length) { toast('Serve almeno una categoria di interfaccia.', 'err'); return false; }
        if (names.some((n) => !n)) { toast('Ogni categoria deve avere un nome.', 'err'); return false; }
        const dup = names.find((n, i) => names.findIndex((m) => m.toLowerCase() === n.toLowerCase()) !== i);
        if (dup) { toast('Categoria duplicata: “' + dup + '”.', 'err'); return false; }
        for (const k of Object.keys(areas)) {
          if (!areas[k].value.split('\n').map((x) => x.trim()).filter(Boolean).length) { toast('La lista “' + LIST_LABELS[k] + '” non può essere vuota.', 'err'); return false; }
        }
        return true;
      }
    }]
  });
  if (!ok) return;
  if (userIn.value.trim() !== prefs.user) { prefs.user = userIn.value.trim(); saveUi(); }
  const renames = new Map(rows.filter((r) => r.orig && r.orig !== r.name.trim()).map((r) => [r.orig, r.name.trim()]));
  commit((st) => {
    st.meta.name = nameIn.value.trim();
    st.meta.program = progIn.value.trim();
    st.lists.ifCategories = rows.map((r) => ({
      name: r.name.trim(), color: /^#[0-9a-f]{6}$/i.test(r.color) ? r.color : '#5b6b7d', cables: !!r.cables,
      subtypes: Array.from(new Set(r.subtypes.split('\n').map((x) => x.trim()).filter(Boolean)))

    st.interfaces.forEach((f) => { if (renames.has(f.category)) f.category = renames.get(f.category); });
    SIMPLE_LISTS.forEach((k) => { st.lists[k] = Array.from(new Set(areas[k].value.split('\n').map((x) => x.trim()).filter(Boolean))); });
  }, 'Impostazioni salvate');
}

    title: 'Errori JavaScript rilevati', wide: true,
    body: [h('p', null, 'L’applicazione ha intercettato ' + plural(errs.length, 'errore', 'errori') + '. I dati salvati non sono stati alterati dalle operazioni fallite.'),
      h('div', { class: 'err-log' }, errs.map((e) => '[' + e.time + '] ' + e.message + (e.detail ? '\n   ' + e.detail.split('\n').slice(0, 4).join('\n   ') : '')).join('\n\n'))],
    buttons: [{ label: 'Chiudi', value: false }, { label: 'Azzera errori', value: true, cls: 'primary' }]
  }).then((r) => {
    if (r) { errs.length = 0; window.__idvPaintStatus(); }
  });
}

/* =====================================================================
   21. NAVIGAZIONE, RENDERING GENERALE, SCORCIATOIE
   ===================================================================== */
function positionPanel() {
  const tb = qs('#sec-board .board-toolbar');
  byId('sidePanel').style.top = ui.section === 'board' && tb ? tb.offsetHeight + 'px' : '0';
}
function showSection(name) {
  if (!byId('sec-' + name)) return;
  ui.section = name;
  positionPanel();
  qsa('#mainNav button').forEach((b) => b.classList.toggle('active', b.dataset.section === name));
  qsa('main > .section').forEach((s) => s.classList.toggle('active', s.id === 'sec-' + name));
  renderSection(name);
  if (name === 'board') {
    if (ui.fitted) fitView(); else applyView();
  }
  saveUi();
}
function renderSection(name) {
  if (!state) return;
  if (name === 'board') renderBoard();
  else if (name === 'dashboard') renderDashboard();
  else renderTableSection(name);
}
function renderNav() {
  const counts = {
    groups: state.groups.length, components: state.components.length, interfaces: state.interfaces.length,
    cables: state.cables.length, requirements: state.requirements.length
  };
  qsa('[data-count]').forEach((el) => {
    const k = el.dataset.count;
    if (k === 'issues') {
      const n = issues.filter((i) => i.sev !== 'info').length;
      const e = issues.filter((i) => i.sev === 'error').length;
      el.textContent = String(n);
      el.classList.toggle('alert', e > 0);
      el.title = e + ' errori, ' + (n - e) + ' avvisi';
    } else el.textContent = String(counts[k]);
  });
  byId('projectName').textContent = (state.meta.name || 'Progetto senza nome') + (state.meta.program ? ' · ' + state.meta.program : '');
  byId('projectName').title = 'Progetto aperto: ' + (state.meta.name || '') + (state.meta.program ? '\nProgramma: ' + state.meta.program : '') + '\nClic per gestire i progetti';
  updateHistoryButtons();
  const dl = byId('boardFindList');
  dl.innerHTML = '';
  state.components.slice().sort((a, b) => cmpNat(a.id, b.id)).forEach((c) => dl.appendChild(h('option', { value: c.id }, c.name)));
}
function renderAll() {
  renderNav();
  renderSection(ui.section);
}
function isTyping(e) {
  const t = e.target;
  return t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
}
function setupGlobalHandlers() {
  qsa('#mainNav button').forEach((b) => b.addEventListener('click', () => showSection(b.dataset.section)));
  byId('btnUndo').addEventListener('click', undo);
  byId('btnRedo').addEventListener('click', redo);
  byId('btnProjects').addEventListener('click', safely(openProjectManager));
  byId('projectName').addEventListener('click', safely(openProjectManager));
  byId('fileProject').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (file) safely(openProjectFile)(file);
  });
  byId('btnSettings').addEventListener('click', safely(openSettings));
  byId('btnHelp').addEventListener('click', () => openHelp());
  byId('appStatus').addEventListener('click', showErrorLog);
  byId('spClose').addEventListener('click', () => requestClosePanel());
  byId('modalBack').addEventListener('mousedown', (e) => { if (e.target === byId('modalBack')) closeModal(null); });
  // clic su chip/pulsanti con data-open="tipo:uid" in qualunque vista
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-open]');
    if (!el) return;
    e.preventDefault();
    e.stopPropagation();
    const i = el.dataset.open.indexOf(':');
    openObject(el.dataset.open.slice(0, i), el.dataset.open.slice(i + 1));
  }, true);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (isModalOpen()) { e.preventDefault(); closeModal(null); return; }
      if (drag && drag.type === 'connect') { drag = null; B.temp.innerHTML = ''; B.svg.classList.remove('connecting'); return; }
      if (panelCtx) { e.preventDefault(); requestClosePanel(); return; }
      if (ui.selected && ui.section === 'board') { ui.selected = null; renderBoard(); }
      return;
    }
    if (isModalOpen()) return;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && !isTyping(e)) {
      const k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
      if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); return; }
    }
    if (mod && e.key.toLowerCase() === 's' && panelCtx) { e.preventDefault(); panelSave(); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && !isTyping(e) && ui.section === 'board' && ui.selected && !panelCtx) {
      if (['component', 'interface', 'cable', 'group'].includes(ui.selected.kind)) { e.preventDefault(); deleteObject(ui.selected.kind, ui.selected.uid); }
    }
  });
  window.addEventListener('beforeunload', () => { saveUi(); writeEmergencyCopy(); });
  window.addEventListener('pagehide', writeEmergencyCopy);
  window.addEventListener('resize', positionPanel);
}

/* =====================================================================
   22. AVVIO (solo a DOM disponibile)
   ===================================================================== */
async function init() {
  try {
    const hadUi = loadUi();
    state = buildEmpty('—', '');   // modello provvisorio finché l'archivio non è pronto
    rebuildIndex();
    setupBoard();
    buildTableSections();
    setupGlobalHandlers();
    setSaveState('saving');
    await Store.init();
    await recoverEmergencyCopy();
    const list = (await Store.listProjects()).filter((p) => !p.deleted).sort((a, b) => (a.updated < b.updated ? 1 : -1));
    const last = await Store.getMeta('lastProject');
    let id = list.some((p) => p.id === last) ? last : (list.length ? list[0].id : null);
    const first = !id;
    if (first) id = await migrateOrCreateFirstProject();
    if (!hadUi || first) ui.fitted = true;
    let opened = await openProject(id, { silent: true, keepView: hadUi && !first });
    if (!opened && list.length > 1) opened = await openProject(list.find((p) => p.id !== id).id, { silent: true });
    showSection(ui.section);
    window.__idvReady = true;
    window.__idvPaintStatus();
    if (Store.mode === 'memory') toast('Il browser non consente di salvare dati: le modifiche andranno perse alla chiusura. Usa Progetti → Salva su file.', 'err', 12000);
    else if (Store.mode === 'ls') toast('Archivio IndexedDB non disponibile: i progetti sono salvati nel localStorage (spazio limitato).', 'warn', 8000);
    else if (first) toast('Benvenuto: è stato creato il progetto dimostrativo. Le modifiche vengono salvate automaticamente; da “Progetti” puoi crearne di nuovi.', 'info', 7000);
    requestPersistentStorage();
  } catch (err) {
    if (window.__idvRecordError) window.__idvRecordError('Inizializzazione non riuscita: ' + (err && err.message ? err.message : err), err && err.stack);
    console.error(err);
  }
}
// API di sola lettura per diagnostica da console
window.IDV = {
  get state() { return state; }, get issues() { return issues; }, ui,
  get routeStats() { return Object.assign({}, lastRouteStats); },
  get routes() { return [...lastItems.values()].map((it) => ({ key: it.key, id: it.L.obj.id, kind: it.L.kind, sA: it.sA, sB: it.sB, manual: it.manual, pts: it.pts.map((q) => [q.x, q.y]) })); },
  get history() { return { past: history.past.map((e) => e.label), future: history.future.map((e) => e.label) }; },
  get project() { return project ? { id: project.id, name: state.meta.name, storage: Store.mode } : null; },
  flush: () => flushSave()
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();
</script>
</body>
